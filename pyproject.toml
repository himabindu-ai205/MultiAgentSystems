[project]
name = "groww-support-agents"
version = "0.1.0"
description = "Multi-agent support reply drafting for GROWW (facts-only, human-approved)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    # Used only for the fixed fan-out and join (Architecture section 4). Pinned, and run
    # with no checkpointer and tracing off, so nothing is stored (C3).
    "langgraph==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls a real model or the configured MCP account. Skipped when those are not set.",
]

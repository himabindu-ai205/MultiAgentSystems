services:
  - type: web
    name: multiagentsystems
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/serve_local.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: MCP_SERVER_URL
        sync: false
      - key: MCP_HTTP_TOKEN
        sync: false
